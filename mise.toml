# Every file under home/ is symlinked to the same path in ~. Directories stay
# real, so ~/.ssh, ~/.claude and ~/.config/gtk-3.0 keep their own permissions
# and the state that lives next to the config.
#
# .claude/settings.json is a public-safe reference copy, not linked: Claude Code
# owns the live file and writes a generated autoMode block into it that names
# local projects, which this public repo leaves out.
[dotfiles]
"~" = { source = "home", mode = "symlink-each", exclude = [".config/git/signing.gitconfig", ".claude/settings.json"] }

# Commit signing only where 1Password's signer is installed; see home/.gitconfig.
# Runs on every `mise bootstrap`, so it has to stay safe to repeat.
[tasks.bootstrap]
run = '''
if command -v op-ssh-sign >/dev/null 2>&1; then
    ln -sfn "{{config_root}}/home/.config/git/signing.gitconfig" ~/.config/git/signing.gitconfig
fi
'''
