# Prefix: C-h instead of C-b.
unbind C-b
set-option -g prefix C-h
bind-key C-h send-prefix

set-option -sg escape-time 0
set-option -g history-limit 50000
set-option -g default-terminal "tmux-256color"
set-option -g renumber-windows on
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g status-left-length 30
set-window-option -g mode-keys emacs
set -g focus-events on

# Let tmux also send copies to the terminal as OSC 52. Ptyxis (VTE) ignores
# OSC 52, so this does nothing there: local copies reach the clipboard only
# through the wl-copy binding below, and copies in a remote tmux over SSH don't
# reach it at all. Kept for terminals that do handle OSC 52 (kitty, foot,
# WezTerm, Ghostty). In those, large copies could race with wl-copy: OSC 52 has
# a size cap and the last write wins. If that bites, only turn OSC 52 on when
# wl-copy is unavailable (an if-shell check at load time). Tested 2026-11-08.
set-option -s set-clipboard on

# Splits that look like what they do.
bind-key | split-window -h
bind-key - split-window -v
unbind '"'
unbind %

bind r source-file ~/.tmux.conf \; display-message "reloaded config"

# System clipboard via wl-clipboard (Wayland).
bind-key -T copy-mode M-w send -X copy-pipe "wl-copy ; tmux display-message \"copied!\""
bind-key C-y run -b "wl-paste -n | tmux load-buffer - ; tmux paste-buffer ; tmux display-message \"pasted!\""
bind-key Y run -b "wl-paste -n | awk 1 ORS=' ' | tmux load-buffer - ; tmux paste-buffer ; tmux display-message \"pasted!\""

# Move panes between windows.
bind-key j command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:"  "join-pane -t '%%'"

# Start or attach a named tmuxstart session.
bind S command-prompt -p "Make/attach session:" "new-window 'tmuxstart \'%%\''"
